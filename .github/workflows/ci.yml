name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-session-signing-value-12345
      AI_SERVICE_SECRET: test-only-internal-service-value-12345
      MONGODB_URI: ""
      REDIS_URL: ""
      GEMINI_API_KEY: ""
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-lock.txt
      - run: npm ci
      - run: python -m pip install -r ai-service/requirements-lock.txt
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: python -m ruff check app tests
        working-directory: ai-service
      - run: python -m pytest -q
        working-directory: ai-service
      - run: npm audit --omit=dev
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: node scripts/secret-scan.mjs
